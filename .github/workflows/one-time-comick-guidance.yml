name: One-time ComicK guidance update

on:
  push:
    branches:
      - main
    paths:
      - .github/comick-guidance.trigger

permissions:
  contents: write

concurrency:
  group: one-time-comick-guidance
  cancel-in-progress: false

jobs:
  update-guidance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update ComicK action guidance
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = "if (source === 'comick') return 'Check the configured ComicK URL/token.';"
          new = "if (source === 'comick') return 'Use an explicit official comick.dev JSON history endpoint and check the configured token.';"

          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected ComicK guidance was not found; refusing a blind edit.')

          path.write_text(text, encoding='utf-8')

      - name: Validate files
        shell: bash
        run: |
          git diff --check
          grep -F "official comick.dev JSON history endpoint" index.html
          test -f manifest.webmanifest
          test -f service-worker.js

      - name: Commit verified change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "ComicK guidance is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "docs: align ComicK health guidance with comick.dev"
          git push

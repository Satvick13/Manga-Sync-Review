name: One-time notification unblock

on:
  push:
    branches:
      - main
    paths:
      - .github/notification-unblock.trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stop notifications blocking refresh
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '      await notifyActionRequired(latestStatuses);'
          new = '      void notifyActionRequired(latestStatuses);'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Expected notification await was not found')
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          grep -F 'void notifyActionRequired(latestStatuses);' index.html

      - name: Commit change
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: do not block review refresh on notifications"
          git push
